<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine Tshirt</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #c7d6f3;
      font-family: Arial, Helvetica, sans-serif;
      color: #1d2a3a;
    }

    .product-card {
      width: min(92vw, 980px);
      background: rgba(244, 246, 249, 0.9);
      border-radius: 24px;
      padding: 40px 42px 36px;
      box-shadow: 0 8px 24px rgba(29, 42, 58, 0.08);
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 38px;
    }

    .gallery {
      display: flex;
      align-items: center;
      gap: 18px;
      justify-content: center;
    }

    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .thumb {
      width: 82px;
      height: 82px;
      border-radius: 12px;
      border: 2px solid rgba(66, 154, 235, 0.7);
      background: linear-gradient(180deg, #dfeefb 0%, #90c9f4 100%);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(55, 118, 190, 0.15);
    }

    .thumb.active {
      border-color: #2f9ae8;
      box-shadow: 0 0 0 2px rgba(47, 154, 232, 0.1);
    }

    .thumb:hover {
      transform: translateY(-1px);
    }

    .shirt-preview {
      width: 290px;
      height: 270px;
      border-radius: 16px;
      background: rgba(141, 200, 244, 0.6);
      border: 1px solid rgba(138, 174, 214, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }

    .shirt-svg {
      width: 210px;
      height: 200px;
      display: block;
      filter: drop-shadow(0 6px 10px rgba(58, 99, 142, 0.12));
    }

    .shirt-svg .body-outline {
      fill: none;
      stroke: rgba(48, 93, 137, 0.22);
      stroke-width: 2;
    }

    .shirt-svg .neck {
      fill: rgba(121, 196, 255, 0.7);
    }

    .details {
      padding-top: 8px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.1rem, 2.4vw, 2.9rem);
      line-height: 1.1;
      color: #1a2f4b;
      letter-spacing: -0.04em;
    }

    .stars {
      display: flex;
      gap: 6px;
      color: #ff9b5e;
      font-size: 1.8rem;
      margin: 0 0 18px;
      letter-spacing: 2px;
    }

    .divider {
      height: 1px;
      background: rgba(67, 91, 120, 0.18);
      margin: 10px 0 26px;
    }

    .price {
      font-size: clamp(2.2rem, 2.7vw, 3rem);
      font-weight: 700;
      color: #142b45;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .price .rupee {
      font-size: 0.9em;
      transform: translateY(-2px);
    }

    p {
      margin: 0;
      max-width: 590px;
      color: rgba(40, 58, 78, 0.82);
      font-size: clamp(1rem, 1.3vw, 1.15rem);
      line-height: 1.6;
    }

    .cta {
      margin-top: 28px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #1f8ad7 0%, #1a7cc4 100%);
      color: white;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 18px 18px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(32, 122, 197, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 22px rgba(32, 122, 197, 0.3);
    }

    .cta:active {
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .product-card {
        grid-template-columns: 1fr;
        padding: 28px 22px 22px;
      }

      .gallery {
        flex-direction: column;
      }

      .thumbs {
        flex-direction: row;
        justify-content: center;
      }

      .shirt-preview {
        width: 100%;
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="product-card">
    <div class="gallery" aria-label="Product gallery">
      <div class="thumbs">
        <button class="thumb active" type="button" data-color="blue" aria-label="Blue shirt">
          <svg class="shirt-svg" viewBox="0 0 180 180" role="img" aria-hidden="true">
            <defs>
              <linearGradient id="shirtGradientBlue" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" stop-color="#dfeefb"/>
                <stop offset="100%" stop-color="#58a6ea"/>
              </linearGradient>
            </defs>
            <path d="M55 28 L70 16 H110 L125 28 L138 42 L129 79 L140 146 C141 157 133 166 121 169 L118 170 H62 C50 167 42 158 43 146 L54 79 L45 42 Z" fill="url(#shirtGradientBlue)"/>
            <path d="M58 30 L71 20 H109 L122 30 L132 42 L120 46 L111 72 L69 72 L60 46 L48 42 Z" fill="rgba(255,255,255,0.20)"/>
            <path d="M69 16 H111 L99 37 H81 Z" fill="#9ad5ff"/>
            <path d="M45 42 L31 60 L42 83 L60 71 L58 48 Z" fill="url(#shirtGradientBlue)"/>
            <path d="M135 42 L149 60 L138 83 L120 71 L122 48 Z" fill="url(#shirtGradientBlue)"/>
            <path d="M77 35 H103 L111 53 H69 Z" fill="#a8d9ff" opacity="0.9"/>
            <path d="M69 72 H111 L116 150 C117 158 111 165 103 165 H77 C69 165 63 158 64 150 Z" fill="none" stroke="rgba(39,83,128,0.28)" stroke-width="2"/>
          </svg>
        </button>
        <button class="thumb" type="button" data-color="light" aria-label="Light blue shirt">
          <svg class="shirt-svg" viewBox="0 0 180 180" role="img" aria-hidden="true">
            <defs>
              <linearGradient id="shirtGradientLight" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" stop-color="#edf8ff"/>
                <stop offset="100%" stop-color="#6bb5ef"/>
              </linearGradient>
            </defs>
            <path d="M55 28 L70 16 H110 L125 28 L138 42 L129 79 L140 146 C141 157 133 166 121 169 L118 170 H62 C50 167 42 158 43 146 L54 79 L45 42 Z" fill="url(#shirtGradientLight)"/>
            <path d="M58 30 L71 20 H109 L122 30 L132 42 L120 46 L111 72 L69 72 L60 46 L48 42 Z" fill="rgba(255,255,255,0.20)"/>
            <path d="M69 16 H111 L99 37 H81 Z" fill="#bfe9ff"/>
            <path d="M45 42 L31 60 L42 83 L60 71 L58 48 Z" fill="url(#shirtGradientLight)"/>
            <path d="M135 42 L149 60 L138 83 L120 71 L122 48 Z" fill="url(#shirtGradientLight)"/>
            <path d="M77 35 H103 L111 53 H69 Z" fill="#d8f0ff" opacity="0.9"/>
            <path d="M69 72 H111 L116 150 C117 158 111 165 103 165 H77 C69 165 63 158 64 150 Z" fill="none" stroke="rgba(39,83,128,0.28)" stroke-width="2"/>
          </svg>
        </button>
        <button class="thumb" type="button" data-color="deep" aria-label="Dark blue shirt">
          <svg class="shirt-svg" viewBox="0 0 180 180" role="img" aria-hidden="true">
            <defs>
              <linearGradient id="shirtGradientDeep" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" stop-color="#a3d4fa"/>
                <stop offset="100%" stop-color="#1d6bc7"/>
              </linearGradient>
            </defs>
            <path d="M55 28 L70 16 H110 L125 28 L138 42 L129 79 L140 146 C141 157 133 166 121 169 L118 170 H62 C50 167 42 158 43 146 L54 79 L45 42 Z" fill="url(#shirtGradientDeep)"/>
            <path d="M58 30 L71 20 H109 L122 30 L132 42 L120 46 L111 72 L69 72 L60 46 L48 42 Z" fill="rgba(255,255,255,0.18)"/>
            <path d="M69 16 H111 L99 37 H81 Z" fill="#a8d9ff"/>
            <path d="M45 42 L31 60 L42 83 L60 71 L58 48 Z" fill="url(#shirtGradientDeep)"/>
            <path d="M135 42 L149 60 L138 83 L120 71 L122 48 Z" fill="url(#shirtGradientDeep)"/>
            <path d="M77 35 H103 L111 53 H69 Z" fill="#c7dff8" opacity="0.85"/>
            <path d="M69 72 H111 L116 150 C117 158 111 165 103 165 H77 C69 165 63 158 64 150 Z" fill="none" stroke="rgba(39,83,128,0.28)" stroke-width="2"/>
          </svg>
        </button>
      </div>

      <div class="shirt-preview" aria-live="polite">
        <svg class="shirt-svg" viewBox="0 0 220 200" role="img" aria-label="Selected product preview">
          <defs>
            <linearGradient id="shirtPreviewGradient" x1="0%" x2="100%" y1="0%" y2="100%">
              <stop offset="0%" stop-color="#dfeefb"/>
              <stop offset="100%" stop-color="#4ea0e8"/>
            </linearGradient>
          </defs>
          <path d="M62 36 L80 18 H140 L158 36 L173 48 L163 80 L171 146 C171 160 160 171 146 174 L142 175 H78 C64 172 52 161 53 146 L61 80 L47 48 Z" fill="url(#shirtPreviewGradient)"/>
          <path d="M66 38 L81 23 H139 L154 38 L165 49 L150 56 L138 80 H82 L70 56 L55 49 Z" fill="rgba(255,255,255,0.12)"/>
          <path d="M86 18 H134 L117 48 H103 Z" fill="#9ad5ff"/>
          <path d="M52 48 L33 66 L45 90 L66 77 L62 54 Z" fill="url(#shirtPreviewGradient)"/>
          <path d="M168 48 L187 66 L175 90 L154 77 L158 54 Z" fill="url(#shirtPreviewGradient)"/>
          <path d="M79 71 H141 L148 147 C149 159 140 169 128 171 H92 C80 169 71 159 72 147 Z" fill="none" stroke="rgba(39,83,128,0.3)" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <div class="details">
      <h1>Fine Shirt</h1>
      <div class="stars" aria-label="4 out of 5 stars">★ ★ ★ ★ ★</div>
      <div class="divider"></div>
      <div class="price"><span class="rupee">₹</span>500.00</div>
      <p>
        Razorpay provides an end-to-end online payments solution. For International payments, we accept Credit Cards, Debit Cards and PayPal wallet. We support nearly 100 major currencies from across the globe.
      </p>
      <button class="cta" type="button" onclick="payNow()">Pay with Razorpay</button>
    </div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const thumbButtons = document.querySelectorAll('.thumb');
    const previewGradient = document.querySelector('#shirtPreviewGradient');
    const previewStops = previewGradient.querySelectorAll('stop');

    const palette = {
      blue: ['#dfeefb', '#4ea0e8'],
      light: ['#edf8ff', '#6bb5ef'],
      deep: ['#b7dcff', '#4d9fe8']
    };

    thumbButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const selected = button.dataset.color;
        const colors = palette[selected];
        previewStops[0].setAttribute('stop-color', colors[0]);
        previewStops[1].setAttribute('stop-color', colors[1]);

        thumbButtons.forEach((thumb) => thumb.classList.toggle('active', thumb === button));
      });
    });

    async function payNow() {
      const amount = 500;

      const response = await fetch('/create-order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ amount, currency: 'INR', receipt: 'receipt#1', notes: {} })
      });

      const order = await response.json();

      const options = {
        key: 'rzp_test_TUpZeEwAn92HGh',
        amount: order.amount,
        currency: order.currency,
        name: 'Your Company Name',
        description: 'Test Transaction',
        order_id: order.id,
        callback_url: 'http://localhost:3000/payment-success',
        prefill: {
          name: 'Your Name',
          email: 'your.email@example.com',
          contact: '9999999999'
        },
        theme: {
          color: '#F37254'
        },
        handler: function (response) {
          fetch('/verify-payment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            })
          }).then(res => res.json())
            .then(data => {
              if (data.status === 'ok') {
                window.location.href = '/payment-success';
              } else {
                alert('Payment verification failed');
              }
            }).catch(error => {
              console.error('Error:', error);
              alert('Error verifying payment');
            });
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
</body>
</html>
